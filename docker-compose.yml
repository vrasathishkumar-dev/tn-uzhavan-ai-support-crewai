version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.backend
    container_name: buildathon_backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/graph_storage:/app/backend/graph_storage
      - ./backend/agent_audit_log.txt:/app/backend/agent_audit_log.txt
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: buildathon_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
